<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Piano</title>
  </head>
  <body>
</html>

<!-- Link to external CSS file for styling -->
<link rel="stylesheet" href="style.css" />

<!-- Link to external JavaScript file -->
<script src="script.js" defer></script>

<!-- Importing font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

<!-- Create a piano -->
<body>
    <h1>Piano</h1>
        <div class="piano">
            <!-- White and Black Keys with corresponding notes -->
            <div data-note="C" class="key white"></div>
            <div data-note="Db" class="key black" style="left: 70px;"></div>
            <div data-note="D" class="key white"></div>
            <div data-note="Eb" class="key black" style="left: 170px;"></div>
            <div data-note="E" class="key white"></div>
            <div data-note="F" class="key white"></div>
            <div data-note="Gb" class="key black" style="left: 370px;"></div>
            <div data-note="G" class="key white"></div>
            <div data-note="Ab" class="key black" style="left: 470px;"></div>
            <div data-note="A" class="key white"></div>
            <div data-note="Bb" class="key black" style="left: 570px;"></div>
            <div data-note="B" class="key white"></div>
        </div>
    
        <!-- Audio elements to store note sounds -->
        <audio id="C" src="notes/C.mp3"></audio>
        <audio id="Db" src="notes/Db.mp3"></audio>
        <audio id="D" src="notes/D.mp3"></audio>
        <audio id="Eb" src="notes/Eb.mp3"></audio>
        <audio id="E" src="notes/E.mp3"></audio>
        <audio id="F" src="notes/F.mp3"></audio>
        <audio id="Gb" src="notes/Gb.mp3"></audio>
        <audio id="G" src="notes/G.mp3"></audio>
        <audio id="Ab" src="notes/Ab.mp3"></audio>
        <audio id="A" src="notes/A.mp3"></audio>
        <audio id="Bb" src="notes/Bb.mp3"></audio>
        <audio id="B" src="notes/B.mp3"></audio>
    
</body>
